<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LPU RoomConnect{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <div class="logo">LPU <span>RoomConnect</span></div>
    <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
</header>

<main>
    {% include "_flash.html" %}
    {% block content %}{% endblock %}
</main>

<footer>
    <p>© 2026 LPU RoomConnect | Campus Room Availability System</p>
</footer>

</body>
</html>
