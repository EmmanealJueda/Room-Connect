
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | LPU RoomConnect</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <div class="logo">LPU <span>RoomConnect</span></div>
        <nav>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>

    <main style="padding: 60px 8%;">
        <h1>Welcome, {{ session["name"] }}!</h1>

        <h2>Your Role: {{ session["role"]|title }}</h2>

        <p>You have successfully logged in to LPU RoomConnect.</p>
    </main>

</body>
</html>
